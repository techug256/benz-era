<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benz Era — Withdraw</title><style>
body{margin:0;background:#d7d9da;font-family:Arial,sans-serif;color:#111}.app{max-width:460px;min-height:100vh;margin:auto;background:#f5f5f4}header{background:#080808;color:white;padding:17px;text-align:center}header b{font:700 25px Georgia,serif;letter-spacing:4px}header span{color:#c5c9cc}main{padding:15px}.hero{background:linear-gradient(135deg,#050505,#303235);color:white;border-radius:19px;padding:20px;margin-bottom:14px}h1{font:700 26px Georgia,serif;margin:5px 0}.box{background:white;border:1px solid #ddd;border-radius:16px;padding:15px;margin-bottom:12px}label{display:block;font-size:8px;font-weight:800;letter-spacing:1px;color:#777;margin-bottom:6px}input,select{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;padding:0 10px;box-sizing:border-box;margin-bottom:11px}button,.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;background:#0b0b0b;color:white;font-weight:800;margin-top:9px;text-decoration:none;text-align:center}.muted{font-size:9px;color:#777}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .btn{margin:0}</style></head><body><div class="app"><header><b>BENZ <span>ERA</span></b></header><main>
<div class="hero"><small>WALLET</small><h1>Withdraw</h1><p>Withdraw using your saved payment destination.</p></div>
<div class="box"><div class="row"><b>Available Balance</b><span id="bal">0</span></div><label>METHOD</label><select id="method"><option value="mobile">Mobile Money</option><option value="usdt">USDT TRC20</option></select><label>AMOUNT</label><input id="amount" type="number" min="1" placeholder="Enter amount"><div id="details" class="muted"></div><button onclick="withdraw()">REQUEST WITHDRAWAL</button></div>
<a class="btn" href="profile.html">BACK TO PROFILE</a>
<script>
const u=BenzEra.current();if(!u){location.href='login.html'}else{bal.textContent=Number(u.balance||0).toLocaleString();show()}
function show(){const u=BenzEra.current(),m=method.value,p=u&&u.payment&&u.payment[m];details.textContent=p?(m==='mobile'?`${p.number} — ${p.name}`:`${p.address} — ${p.exchange}`):'No saved payment method.'}method.onchange=show;
function withdraw(){try{BenzEra.transaction('withdraw',amount.value,method.value);alert('Withdrawal request recorded.');location.href='profile.html'}catch(e){alert(e.message)}}
</script>
</main></div><script src="assets/js/benz-era.js"></script></body></html>
