<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benz Era — Team</title><style>body{margin:0;background:#d7d9da;font-family:Arial;color:#111}.app{max-width:460px;min-height:100vh;margin:auto;background:#f5f5f4}.top{background:#080808;color:#fff;padding:16px;text-align:center}.logo{font:700 25px Georgia;letter-spacing:4px}.logo span{color:#bbb}.hero,.card{margin:15px 13px;background:#fff;border:1px solid #ddd;border-radius:17px;padding:16px}.hero{background:linear-gradient(135deg,#070707,#242526);color:#fff}.hero h1{font:700 27px Georgia;margin:7px 0}.sub{font-size:9px;color:#999}.hero .sub{color:#ccc}.code{margin-top:12px;padding:11px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:10px;word-break:break-all}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;background:#f0f1f1;border-radius:12px}.stat b{display:block;font:700 22px Georgia}.stat span{font-size:7px;color:#777}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:#111;color:#fff;font-weight:800;font-size:9px}.back{width:calc(100% - 26px);margin:0 13px;border:0;border-radius:10px;padding:12px;background:#eee;font-size:9px;font-weight:800}</style></head><body><div class="app"><header class="top"><div class="logo">BENZ <span>ERA</span></div></header><section class="hero"><div class="sub">REFERRAL NETWORK</div><h1>My Team.</h1><div class="sub">Share your referral link and grow your Benz Era network.</div><div class="code" id="link">Generating referral link…</div></section><section class="card"><div class="stats"><div class="stat"><b id="direct">0</b><span>DIRECT REFERRALS</span></div><div class="stat"><b id="total">0</b><span>TOTAL TEAM</span></div></div><div style="height:12px"></div><button class="primary" onclick="copyLink()">COPY REFERRAL LINK</button></section><button class="back" onclick="location.href='profile.html'">BACK TO PROFILE</button></div><script>const code=localStorage.getItem('benz_referral_code')||localStorage.getItem('benz_user_id')||'BENZ-MEMBER';const link=location.origin+location.pathname.replace(/\/team\.html$/,'/register.html')+'?ref='+encodeURIComponent(code);document.getElementById('link').textContent=link;function copyLink(){navigator.clipboard?.writeText(link);alert('Referral link copied')}let team=[];try{team=JSON.parse(localStorage.getItem('benz_team')||'[]')}catch(e){}document.getElementById('direct').textContent=team.length;document.getElementById('total').textContent=team.length;</script></body></html>
