<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benz Era — Withdraw</title><style>body{margin:0;background:#d7d9da;font-family:Arial;color:#111}.app{max-width:460px;min-height:100vh;margin:auto;background:#f5f5f4}.top{background:#080808;color:#fff;padding:16px;text-align:center}.logo{font:700 25px Georgia;letter-spacing:4px}.logo span{color:#bbb}.card{margin:15px 13px;background:#fff;border:1px solid #ddd;border-radius:17px;padding:16px;box-shadow:0 7px 20px #0001}h1{font:700 26px Georgia;margin:5px 0}.sub{font-size:9px;color:#777;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.tab,button{border:0;border-radius:10px;padding:12px;font-weight:800;font-size:9px}.tab{background:#eee}.tab.active{background:#111;color:#fff}.field{margin-top:14px}label{display:block;font-size:8px;font-weight:900;letter-spacing:1px;color:#777;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.primary{width:100%;margin-top:14px;background:#111;color:#fff}.method{margin-top:14px;padding:12px;background:#f0f1f1;border-radius:11px;font-size:8px;line-height:1.5}.back{background:#eee;width:calc(100% - 26px);margin:0 13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:9px;font-size:10px;display:none}.toast.show{display:block}</style></head><body><div class="app"><header class="top"><div class="logo">BENZ <span>ERA</span></div></header><section class="card"><div class="sub">WALLET</div><h1>Withdraw Funds.</h1><div class="sub">Choose where your withdrawal should be sent. Your saved payment details are shown below.</div><div class="tabs"><button class="tab active" onclick="method('mobile',this)">MOBILE MONEY</button><button class="tab" onclick="method('usdt',this)">USDT TRC20</button></div><div class="method" id="details"></div><div class="field"><label>AMOUNT</label><input id="amount" type="number" min="1" placeholder="Enter amount"></div><button class="primary" onclick="withdraw()">REQUEST WITHDRAWAL</button></section><button class="back" onclick="location.href='profile.html'">BACK TO PROFILE</button></div><div id="toast" class="toast"></div><script>let type='mobile';function method(t,b){type=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function render(){let d=document.getElementById('details');if(type==='mobile'){d.innerHTML='<b>Mobile Money</b><br>Number: '+(localStorage.getItem('benz_mobile_number')||'Not added')+'<br>Name: '+(localStorage.getItem('benz_mobile_name')||'Not added')}else{d.innerHTML='<b>USDT TRC20</b><br>Exchange: '+(localStorage.getItem('benz_exchange_name')||'Not added')+'<br>Address: '+(localStorage.getItem('benz_usdt_address')||'Not added')}}function withdraw(){let a=document.getElementById('amount').value;if(!a||a<=0){msg('Enter a valid amount');return}if(type==='mobile'&&!localStorage.getItem('benz_mobile_number')){msg('Add Mobile Money first');return}if(type==='usdt'&&!localStorage.getItem('benz_usdt_address')){msg('Add USDT wallet first');return}localStorage.setItem('benz_last_withdrawal',JSON.stringify({amount:a,method:type,date:new Date().toISOString(),status:'pending'}));msg('Withdrawal request created');setTimeout(()=>location.href='profile.html',900)}function msg(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}render()</script></body></html>
